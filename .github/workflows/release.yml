name: Release
run-name: Monkado ${{ inputs.version }}

# Gera o instalador e o zip do Windows e publica o release que o atualizador do app lê.
# Uso: Actions → Release → Run workflow (versão, ex. 1.1.0)
#  ou: gh workflow run release.yml -R monkey-land/monkado -f version=1.1.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão nova (ex. 1.1.0), maior que a atual
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: monkado-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Validar versão
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: '$VERSION' (use X.Y.Z)"; exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::O release $TAG já existe"; exit 1
          fi
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
          if [ "$VERSION" = "$current" ] || [ "$newest" != "$VERSION" ]; then
            echo "::error::$VERSION precisa ser maior que a versão atual $current"; exit 1
          fi

      - name: Aplicar versão
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Instalar NSIS
        shell: pwsh
        run: |
          # choco exits 0 when its feed is down; require makensis before the long build.
          $found = { (Get-Command makensis -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -or
            (Test-Path "$env:ProgramFiles\NSIS\makensis.exe") }
          foreach ($attempt in 1..3) {
            choco install nsis --no-progress -y
            if (& $found) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (30 * $attempt) }
          }
          throw "NSIS não foi instalado (makensis ausente); o instalador não seria gerado."

      - name: Compilar e empacotar
        run: cargo xtask package

      - name: Preparar arquivos do release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "dist/*" -DestinationPath "release-assets/monkado-$env:TAG-Windows-X64.zip"
          Copy-Item "dist-installer/monkado-$env:VERSION-setup.exe" "release-assets/monkado-$env:VERSION-setup.exe"
          Push-Location release-assets
          $lines = Get-ChildItem -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Pop-Location
          Get-ChildItem release-assets

      - name: Salvar versão no repositório
        run: |
          git config user.name "nosycolg"
          git config user.email "nosycolg@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: versão $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Escrever notas da versão
        run: |
          # The app's update log shows these notes; built from each PR's "Notas da versão".
          PREVIOUS="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          python tools/release-notes.py "$GITHUB_REPOSITORY" "$PREVIOUS" "$(git rev-parse HEAD)" > release-notes.md
          cat release-notes.md

      - name: Publicar release
        run: |
          gh release create "$TAG" release-assets/* \
            -R "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Monkado $VERSION" \
            --notes-file release-notes.md
